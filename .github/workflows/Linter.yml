name: Cleanup Commit Messages

on:
  workflow_dispatch:
    inputs:
      start_commit:
        description: 'Start commit SHA (from this point onwards, or leave empty for all)'
        required: false
        type: string

jobs:
  cleanup-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Generate commit message mapping
        id: mapping
        run: |
          python3 << 'EOF'
          import subprocess
          import json
          from pathlib import Path
          from datetime import datetime
          
          # Get all commits
          result = subprocess.run(
              ['git', 'log', '--pretty=format:%H|%ai|%s'],
              capture_output=True,
              text=True
          )
          
          commits = result.stdout.strip().split('\n')
          mapping = {}
          
          for line in commits:
              if not line.strip():
                  continue
              parts = line.split('|')
              commit_sha = parts[0]
              date_str = parts[1].split(' ')[0]  # YYYY-MM-DD
              message = parts[2] if len(parts) > 2 else "Initial commit"
              
              # Get changed files in this commit
              files_result = subprocess.run(
                  ['git', 'show', '--pretty=', '--name-only', commit_sha],
                  capture_output=True,
                  text=True
              )
              
              changed_files = [f for f in files_result.stdout.strip().split('\n') if f.strip()]
              
              # Generate new message from files
              file_names = []
              for file_path in changed_files:
                  # Get filename without extension
                  name_only = Path(file_path).stem
                  if name_only:
                      file_names.append(name_only)
              
              if file_names:
                  unique_files = list(set(file_names))[:3]  # Limit to 3 files
                  new_message = f"{', '.join(unique_files)} ({date_str}) Edited"
              else:
                  new_message = f"({date_str}) Edited"
              
              mapping[commit_sha] = new_message
          
          # Save to file for next step
          with open('commit_mapping.json', 'w') as f:
              json.dump(mapping, f)
          
          print(f"Generated mapping for {len(mapping)} commits")
          EOF

      - name: Apply commit message changes
        run: |
          python3 << 'EOF'
          import subprocess
          import json
          import os
          
          with open('commit_mapping.json', 'r') as f:
              mapping = json.load(f)
          
          if not mapping:
              print("No commits to process")
              exit(0)
          
          commits_list = list(mapping.keys())
          print(f"Processing {len(commits_list)} commits...")
          
          # Get the initial commit SHA
          initial_result = subprocess.run(
              ['git', 'rev-list', '--max-parents=0', 'HEAD'],
              capture_output=True,
              text=True
          )
          initial_commit = initial_result.stdout.strip()
          
          # Create git filter-branch command for rewriting commit messages
          try:
              env = os.environ.copy()
              env['GIT_SEQUENCE_EDITOR'] = ':'
              
              # Use git filter-branch to rewrite all commits
              subprocess.run(
                  ['git', 'filter-branch', '--msg-filter', 
                   f'''python3 -c "import sys, json; m=json.load(open('commit_mapping.json')); \
                    sha=open('/dev/stdin').read().strip(); \
                    print(m.get(sha, sha))" ''',
                   '--', '--all'],
                  check=False,
                  env=env
              )
          except Exception as e:
              print(f"Warning: {e}")
          
          EOF

      - name: Force push to main branch
        run: |
          # Remove backup refs from filter-branch
          git update-ref -d refs/original/refs/heads/main 2>/dev/null || true
          git push origin main --force-with-lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create summary
        run: |
          echo "## Commit Message Cleanup Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All commit messages have been updated to the format:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`[filename(s) + date] Edited\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "例: \`index (2025-11-13) Edited\`" >> $GITHUB_STEP_SUMMARY
