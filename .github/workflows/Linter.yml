name: Recommit All Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recommit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Recommit files
        shell: bash
        run: |
          find . -type f \
            -not -path "./.git/*" \
            -not -path "./.github/workflows/*" \
            -print0 |
          while IFS= read -r -d '' file
          do
            rel="${file#./}"

            name=$(basename "$rel")
            base="${name%.*}"

            last_date=$(git log -1 --format=%cs -- "$rel")
            [ -z "$last_date" ] && last_date=$(date +%F)

            # テキストファイルなら先頭にU+200Bを付与
            if grep -Iq . "$rel" 2>/dev/null; then
              printf '\u200B' | cat - "$rel" > "$rel.tmp"
              mv "$rel.tmp" "$rel"

              git add "$rel"

              # 実際に変更があった場合のみ通常コミット
              if ! git diff --cached --quiet; then
                git commit -m "$base $last_date Edited"
              else
                git commit --allow-empty -m "$base $last_date Edited"
              fi
            else
              # バイナリは空コミット
              git commit --allow-empty -m "$base $last_date Edited"
            fi
          done

      - name: Push
        run: git push origin main
